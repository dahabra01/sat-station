# Earth Track: refresh the Meteor orbit data once a day so the pass times stay right.
name: Refresh Meteor orbits
on:
  schedule:
    - cron: "17 2 * * *"      # 06:17 Dubai, every day
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch METEOR-M2 3 and 4 from CelesTrak
        run: |
          set -e
          curl -fsS -m 30 "https://celestrak.org/NORAD/elements/gp.php?NAME=METEOR-M2&FORMAT=tle" -o /tmp/all.tle
          awk '/^METEOR-M2 [34] *$/{n=3} n-->0' /tmp/all.tle | tr -d '\r' > /tmp/new.tle
          [ "$(grep -c '^1 ' /tmp/new.tle)" = "2" ] || { echo "Didn't get both satellites; keeping the old file"; cat /tmp/all.tle; exit 1; }
          cp /tmp/new.tle earth/tle.txt
      - name: Commit if changed
        run: |
          git config user.name "sat-station-bot"
          git config user.email "sat-station-bot@users.noreply.github.com"
          git add earth/tle.txt
          git diff --cached --quiet && echo "No change" || git commit -m "Earth Track: refresh Meteor orbits" && git push
