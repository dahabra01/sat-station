<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#123150"/>
      <stop offset="1" stop-color="#06101c"/>
    </radialGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4a72"/>
      <stop offset="1" stop-color="#0b1a2c"/>
    </linearGradient>
    <clipPath id="c"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <g fill="#eef3f8">
      <circle cx="96" cy="120" r="4"/><circle cx="420" cy="96" r="3"/><circle cx="380" cy="190" r="2.5"/>
      <circle cx="140" cy="214" r="2.5"/><circle cx="62" cy="300" r="2"/><circle cx="452" cy="270" r="2.5"/>
    </g>
    <path d="M60 84 l0 22 M49 95 l22 0" stroke="#eef3f8" stroke-width="3" stroke-linecap="round"/>
    <!-- orbit -->
    <path d="M30 420 C 90 120, 422 120, 482 420" fill="none" stroke="#e8b45c" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 26"/>
    <!-- earth -->
    <circle cx="256" cy="880" r="470" fill="url(#earth)" stroke="#e8b45c" stroke-width="8"/>
    <!-- downlink -->
    <g fill="#5ee1e6"><circle cx="256" cy="246" r="9"/><circle cx="256" cy="290" r="8" opacity=".8"/><circle cx="256" cy="330" r="7" opacity=".6"/></g>
    <!-- satellite -->
    <g transform="translate(256 178) rotate(-14)">
      <rect x="-142" y="-24" width="98" height="48" rx="4" fill="#20416a" stroke="#5ee1e6" stroke-width="7"/>
      <rect x="44" y="-24" width="98" height="48" rx="4" fill="#20416a" stroke="#5ee1e6" stroke-width="7"/>
      <path d="M-110 -24v48M-77 -24v48M77 -24v48M110 -24v48" stroke="#5ee1e6" stroke-width="5" opacity=".7"/>
      <path d="M-44 0h14M30 0h14" stroke="#eef3f8" stroke-width="8"/>
      <rect x="-32" y="-32" width="64" height="64" rx="8" fill="#eef3f8"/>
      <rect x="-18" y="-18" width="36" height="36" rx="4" fill="#e8b45c"/>
    </g>
    <!-- dipole -->
    <g stroke="#e8b45c" stroke-width="16" stroke-linecap="round" fill="none">
      <path d="M256 404 L176 358 M256 404 L336 358 M256 404 V440"/>
    </g>
    <circle cx="256" cy="404" r="12" fill="#eef3f8"/>
